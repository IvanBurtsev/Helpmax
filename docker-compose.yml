# Локальный запуск: Postgres, Redis, миграции и приложение.
# Секреты берутся из .env рядом с этим файлом (Compose подставляет ${VAR}).
#   docker compose up --build          # миграции, затем приложение
#   docker compose run --rm migrate    # только миграции
x-app-env: &app-env
  # Локально development: токен MAX необязателен. В проде — production.
  NODE_ENV: development
  PORT: "3000"
  DATABASE_URL: postgres://femida:femida@postgres:5432/femida
  REDIS_URL: redis://redis:6379
  MAX_API_BASE: ${MAX_API_BASE:-https://platform-api2.max.ru}
  MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
  MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: femida
      POSTGRES_PASSWORD: femida
      POSTGRES_DB: femida
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U femida -d femida"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: ["node", "dist/migrate.js"]
    environment: *app-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment: *app-env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Воркер: разбор событий и отправка сообщений. Нужен MAX_BOT_TOKEN.
  # restart: "no" — чтобы без токена не было цикла перезапусков.
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    environment: *app-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  redisdata:
